# ─────────────────────────────────────────────────────────────────────────────
# Déploiement continu de Dagster sur un serveur DigitalOcean (droplet).
#
# ⚠️  Workflow conservé à titre documentaire : le droplet qui hébergeait la
#     plateforme a été décommissionné. Le déclenchement automatique sur push
#     est donc désactivé — seul un lancement manuel est possible, et il
#     échouera tant que les secrets DO_HOST / DO_USER / DO_SSH_KEY ne pointent
#     pas vers un serveur actif.
#
#     Pour faire tourner le projet aujourd'hui : docker-compose up --build
#     (voir le README). L'intégration continue vit dans ci.yaml.
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy Dagster (droplet, manuel)

on:
  workflow_dispatch:

env:
  # Nom de l'image Docker (en minuscules)
  IMAGE_NAME: ghcr.io/yassermourabih/anime-data-platform:latest

jobs:
  
  # --- TÂCHE 1: CONSTRUIRE L'IMAGE ---
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write 
    steps:
      - name: 1. Cloner le dépôt
        uses: actions/checkout@v3
      - name: 2. Se connecter au GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 3. Construire et Pousser l'image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}

  # --- TÂCHE 2: DÉPLOYER LE CONTENEUR ---
  deploy-to-droplet:
    needs: build-and-push-image
    runs-on: ubuntu-latest

    steps:
      - name: 1. Déployer sur le serveur DigitalOcean
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script_stop: true
          
          # Le script à exécuter sur le serveur
          script: |
            echo "✅ 1/5 - Connexion SSH réussie"
            
            export DEPLOY_DIR="/root/anime-data-platform"
            cd $DEPLOY_DIR
            
            echo "🔑 2/5 - Création du fichier .env..."

            # Écriture ligne par ligne : évite toute interpolation du shell
            # sur les valeurs des secrets (mots de passe, tokens).
            echo "DEPLOYMENT_MODE=cloud" > $DEPLOY_DIR/.env
            echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> $DEPLOY_DIR/.env
            echo "ANILIST_API_URL=${{ secrets.ANILIST_API_URL }}" >> $DEPLOY_DIR/.env
            echo "GITHUB_TOKEN=${{ secrets.DEPLOY_GITHUB_TOKEN }}" >> $DEPLOY_DIR/.env
            echo "GITHUB_REPO=${{ secrets.PROJECT_REPO }}" >> $DEPLOY_DIR/.env
            echo "GITHUB_RELEASE_TAG=${{ secrets.PROJECT_RELEASE_TAG }}" >> $DEPLOY_DIR/.env

            echo "✅ Fichier .env créé."

            echo "🐳 3/5 - Pull de la nouvelle image: ${{ env.IMAGE_NAME }}"
            docker pull ${{ env.IMAGE_NAME }}
            
            echo "🛑 4/5 - Arrêt de l'ancien conteneur dagster_app"
            docker rm -f dagster_app || true
            
            echo "🚀 5/5 - Démarrage du nouveau conteneur !"
            docker run -d -p 3000:3000 \
              --env-file $DEPLOY_DIR/.env \
              -e DAGSTER_HOME=/app/dagster_home \
              -v dagster_storage:/app/dagster_home \
              --name dagster_app \
              --restart always \
              ${{ env.IMAGE_NAME }}
            
            echo "🎉 Déploiement terminé !"